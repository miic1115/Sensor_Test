<!DOCTYPE html>
<html class="dark" lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>Sensor Lab V3</title>
    
    <!-- App Icon (請在此處替換您的 Base64 代碼) -->
    <meta name="apple-mobile-web-app-title" content="DPace V3">
    <link rel="apple-touch-icon" href="在此處貼上您的Base64代碼">
    <link rel="icon" type="image/png" href="在此處貼上您的Base64代碼">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@300;400;700;900&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ccff00",
                        "surface": "#121212", 
                        "accent-red": "#ff3333",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "mono": ["Chivo Mono", "monospace"]
                    }
                },
            },
        }
    </script>
    <style>
        body { background-color: #000; color: #fff; touch-action: none; user-select: none; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .canvas-container { position: relative; width: 100%; height: 220px; border-top: 1px solid #333; border-bottom: 1px solid #333; background: #0a0a0a; }
        canvas { display: block; width: 100%; height: 100%; }
        .flash { animation: flash-anim 0.2s ease-out; }
        @keyframes flash-anim {
            0% { background-color: rgba(204, 255, 0, 0.25); }
            100% { background-color: transparent; }
        }
        .timer-font { font-family: 'Chivo Mono', monospace; font-variant-numeric: tabular-nums; }
        
        /* Custom Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #ccff00; }
        .toggle-checkbox:checked + .toggle-label { background-color: #ccff00; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] font-display">

    <!-- Header -->
    <header class="h-14 flex items-center justify-between px-4 border-b border-white/10 bg-surface flex-shrink-0">
        <h1 class="font-bold text-sm tracking-widest text-primary uppercase">Sensor Lab <span class="text-white">V3</span></h1>
        <div class="flex gap-2">
            <div class="text-[10px] text-white/50 bg-white/10 px-2 py-1 rounded font-mono flex items-center gap-1" id="gps-status">
                <span class="material-symbols-outlined text-[12px]">satellite_alt</span> WAIT
            </div>
            <div class="text-[10px] text-white/50 bg-white/10 px-2 py-1 rounded font-mono" id="sensor-status">IMU: OFF</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative overflow-hidden" id="main-area">
        
        <!-- Dual Dashboard (SPM & Speed) -->
        <div class="flex-[3] flex items-center justify-center relative z-10 w-full p-4 gap-4">
            
            <!-- Left: SPM -->
            <div class="flex-1 flex flex-col items-center justify-center bg-surface/50 border border-white/5 rounded-2xl h-full py-4">
                <div class="text-[10px] text-white/40 font-bold uppercase tracking-widest mb-1">Stroke Rate</div>
                <div class="timer-font text-7xl min-[400px]:text-8xl font-black text-primary leading-none tracking-tighter" id="spm-val">--</div>
                <div class="text-white/60 font-bold text-sm mt-1">SPM</div>
            </div>

            <!-- Right: Speed -->
            <div class="flex-1 flex flex-col items-center justify-center bg-surface/50 border border-white/5 rounded-2xl h-full py-4">
                <div class="text-[10px] text-white/40 font-bold uppercase tracking-widest mb-1">Boat Speed</div>
                <div class="timer-font text-6xl min-[400px]:text-7xl font-black text-white leading-none tracking-tighter" id="speed-val">0.0</div>
                <div class="text-white/60 font-bold text-sm mt-2">km/h</div>
            </div>

        </div>

        <!-- Live Chart (Adaptive Envelope) -->
        <div class="canvas-container flex-shrink-0">
            <canvas id="chart"></canvas>
            <div class="absolute top-2 left-2 text-[10px] text-primary/70 font-mono tracking-wider">NET ACCELERATION (G-Filtered)</div>
            <div class="absolute bottom-2 right-2 text-[10px] text-red-400 font-mono font-bold" id="th-display">Auto-TH: 0.00</div>
        </div>

        <!-- Controls -->
        <div class="flex-[2] flex flex-col items-center justify-start p-5 gap-4 w-full bg-surface">
            
            <!-- GPS Gating Toggle -->
            <div class="w-full max-w-xs flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/10">
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-white">Strict GPS Gate</span>
                    <span class="text-[10px] text-white/50 leading-tight">Must be > 2km/h to count SPM.<br>Turn OFF for dry-land testing.</span>
                </div>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="gps-gate-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 top-0 bottom-0 m-auto"/>
                    <label for="gps-gate-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label>
                </div>
            </div>

            <!-- Enable Button -->
            <button id="btn-enable" onclick="requestSensorPermission()" class="w-full max-w-xs bg-primary text-black font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(204,255,0,0.4)] active:scale-95 transition-transform uppercase tracking-wider text-sm mt-2">
                啟動測試 (Enable Sensors)
            </button>

            <!-- Debug Info -->
            <div class="w-full text-center mt-auto pb-2">
                <span class="text-[10px] text-white/30 font-mono" id="debug-info">Base: 9.80 | Net: 0.00</span>
            </div>
        </div>

    </main>

<script>
    // --- Algorithm Configuration V3 ---
    const CONFIG = {
        filterAlpha: 0.85,      // 低通濾波係數 (用來找重力基準線)
        minThreshold: 0.3,      // [V3更新] 絕對最低門檻，從 0.5 降到 0.3，對輕微起伏更敏感
        envelopeDecay: 0.99,    // [V3更新] 包絡線衰減率，從 0.995 稍微加快到 0.99，快速適應輕柔力道
        envelopeRatio: 0.6,     // 動態門檻比例 (取近期最大推力的 60% 作為門檻)
        debounceMs: 400,        // 防抖動 (400ms = 允許最高 150 SPM)
        speedGateKmH: 2.0,      // GPS閘門速度
        chartPoints: 120        // 圖表解析度
    };

    // --- Core State ---
    const state = {
        active: false,
        gpsReady: false,
        speed: 0,
        useGpsGate: false, // 預設關閉，方便陸地測試
        
        // Sensor Math
        estimatedGravity: 9.81, // 系統會自動學習這個值
        linearAcc: 0,           // 去除重力後的淨推力
        localPeak: 0.3,         // [V3更新] 初始化對應 minThreshold
        currentThreshold: 0.3,  // [V3更新] 初始化對應 minThreshold
        
        // SPM Math
        lastPeakTime: 0,
        strokeTimes: [],        // 儲存最近3次的間距用來做移動平均
        
        // Visualizer
        historyAcc: new Array(CONFIG.chartPoints).fill(0),
        historyTh: new Array(CONFIG.chartPoints).fill(0.3) // [V3更新]
    };

    // --- DOM Elements ---
    const els = {
        spmVal: document.getElementById('spm-val'),
        speedVal: document.getElementById('speed-val'),
        sensorStatus: document.getElementById('sensor-status'),
        gpsStatus: document.getElementById('gps-status'),
        btnEnable: document.getElementById('btn-enable'),
        debug: document.getElementById('debug-info'),
        main: document.getElementById('main-area'),
        canvas: document.getElementById('chart'),
        thDisplay: document.getElementById('th-display'),
        gpsToggle: document.getElementById('gps-gate-toggle')
    };
    const ctx = els.canvas.getContext('2d');

    // Toggle Listener
    els.gpsToggle.addEventListener('change', (e) => {
        state.useGpsGate = e.target.checked;
    });

    // --- GPS Logic ---
    function initGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const speedMs = position.coords.speed;
                    state.speed = speedMs ? (speedMs * 3.6) : 0.0;
                    els.speedVal.innerText = state.speed.toFixed(1);
                    
                    state.gpsReady = true;
                    els.gpsStatus.innerHTML = `<span class="material-symbols-outlined text-[12px] text-primary">satellite_alt</span> ON`;
                    els.gpsStatus.classList.add('text-primary');
                },
                (err) => { 
                    state.gpsReady = false; 
                    els.gpsStatus.innerHTML = `<span class="material-symbols-outlined text-[12px] text-accent-red">satellite_alt</span> ERR`;
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }
    }

    // --- Advanced Sensor Math V3 ---
    function handleMotion(event) {
        const acc = event.accelerationIncludingGravity;
        if (!acc) return;

        // 1. Calculate Magnitude
        const x = acc.x || 0;
        const y = acc.y || 0;
        const z = acc.z || 0;
        const rawMag = Math.sqrt(x*x + y*y + z*z);

        // 2. High-Pass Filter (Gravity Isolation)
        // 學習當前的重力值 (Low-pass)
        state.estimatedGravity = (CONFIG.filterAlpha * state.estimatedGravity) + ((1 - CONFIG.filterAlpha) * rawMag);
        // 算出淨推力 (High-pass)，並取絕對值(因為拉水和回槳我們都要看)
        state.linearAcc = Math.abs(rawMag - state.estimatedGravity);

        // 3. Adaptive Envelope (動態門檻核心)
        // 慢慢讓最高點衰減
        state.localPeak *= CONFIG.envelopeDecay;
        
        // 如果遇到更大的推力，更新最高點
        if (state.linearAcc > state.localPeak) {
            state.localPeak = state.linearAcc;
        }

        // 算出當前門檻 (最高點的 60%，但不能低於底限 minThreshold)
        state.currentThreshold = Math.max(CONFIG.minThreshold, state.localPeak * CONFIG.envelopeRatio);

        // Update Chart Arrays
        state.historyAcc.push(state.linearAcc);
        state.historyAcc.shift();
        state.historyTh.push(state.currentThreshold);
        state.historyTh.shift();

        // 4. Peak Detection & Gating
        processStroke(state.linearAcc, state.currentThreshold);

        // Debug Output
        els.debug.innerText = `Grav: ${state.estimatedGravity.toFixed(2)} | Net: ${state.linearAcc.toFixed(2)}`;
        els.thDisplay.innerText = `Auto-TH: ${state.currentThreshold.toFixed(2)}`;
    }

    function processStroke(accValue, threshold) {
        const now = Date.now();
        
        // Gating Logic (如果開啟了 GPS 閘門，且速度低於速度底限，則忽略動作)
        if (state.useGpsGate && state.speed < CONFIG.speedGateKmH) {
            els.spmVal.innerText = "IDLE";
            els.spmVal.style.fontSize = "3rem";
            els.spmVal.classList.remove('text-primary');
            els.spmVal.classList.add('text-white/30');
            state.strokeTimes = []; // 清空陣列
            return;
        } else {
            els.spmVal.style.fontSize = ""; // 恢復字體大小
            if(els.spmVal.innerText === "IDLE") els.spmVal.innerText = "--";
        }

        // Peak Condition
        if (accValue > threshold && (now - state.lastPeakTime > CONFIG.debounceMs)) {
            
            // Valid Stroke!
            const deltaSec = (now - state.lastPeakTime) / 1000;
            state.lastPeakTime = now;
            
            triggerFlash();

            // 如果間隔太久(超過3秒 = 低於20 SPM)，視為重新起步
            if (deltaSec > 3.0) {
                state.strokeTimes = [];
                return;
            }

            // Moving Average for SPM (平滑化數字跳動)
            const instantSpm = 60 / deltaSec;
            state.strokeTimes.push(instantSpm);
            if (state.strokeTimes.length > 3) state.strokeTimes.shift();

            // Calculate Average
            const avgSpm = Math.round(state.strokeTimes.reduce((a, b) => a + b) / state.strokeTimes.length);
            
            if (avgSpm > 20 && avgSpm < 150) {
                els.spmVal.innerText = avgSpm;
                els.spmVal.classList.add('text-white');
                els.spmVal.classList.remove('text-primary');
                setTimeout(() => {
                    els.spmVal.classList.add('text-primary');
                    els.spmVal.classList.remove('text-white');
                }, 150);
            }
        }
    }

    function triggerFlash() {
        els.main.classList.remove('flash');
        void els.main.offsetWidth;
        els.main.classList.add('flash');
        if(navigator.vibrate) navigator.vibrate(40);
    }

    // --- Permissions & Init ---
    async function requestSensorPermission() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const permissionState = await DeviceMotionEvent.requestPermission();
                if (permissionState === 'granted') {
                    startApp();
                } else {
                    alert("需要感測器權限才能運作。");
                }
            } catch (error) {
                console.error(error);
            }
        } else {
            startApp();
        }
    }

    function startApp() {
        window.addEventListener('devicemotion', handleMotion);
        initGPS();
        state.active = true;
        els.sensorStatus.innerText = "IMU: ON";
        els.sensorStatus.classList.add("text-primary");
        els.btnEnable.style.display = 'none';
    }

    // --- Advanced Visualizer (Centered at 0) ---
    function drawLoop() {
        const w = els.canvas.width = els.canvas.clientWidth;
        const h = els.canvas.height = els.canvas.clientHeight;
        
        ctx.clearRect(0, 0, w, h);
        
        // Mapping: 0 is at the bottom. Max visual range is approx 5.0 m/s^2
        const MAX_G = 6.0;
        const mapY = (val) => h - Math.min((val / MAX_G) * h, h); 
        
        // 1. Draw Baseline 0 (Grey)
        const zeroY = h - 1;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(w, zeroY); ctx.stroke();

        const step = w / CONFIG.chartPoints;

        // 2. Draw Dynamic Threshold Line (Red Envelope)
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 80, 80, 0.8)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        state.historyTh.forEach((val, i) => {
            const x = i * step;
            const y = mapY(val);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. Draw Net Acceleration Signal (Neon Green)
        ctx.beginPath();
        ctx.strokeStyle = '#ccff00';
        ctx.lineWidth = 2;
        // 加上一點陰影讓它有發光感
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#ccff00';
        
        state.historyAcc.forEach((val, i) => {
            const x = i * step;
            const y = mapY(val);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();
        
        ctx.shadowBlur = 0; // reset

        requestAnimationFrame(drawLoop);
    }

    requestAnimationFrame(drawLoop);

</script>
</body>
</html>
